[project]
name = "agentsched"
version = "0.1.0"
description = "Scheduling concurrent coding agents on unified-memory hardware"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyarrow>=26.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentsched"]

[tool.pyright]
venvPath = "."
venv = ".venv"
